[package]
name = "capsudo-transport"
description = "Transport abstraction for capsudo: local Unix sockets today, cross-zone IDM tomorrow"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
# A demonstrable cross-zone transport stub built on the multiplexer, standing in
# for a real Edera Protect IDM channel with TCP. Off by default.
idm = []

[dependencies]
capsudo-proto.workspace = true
thiserror.workspace = true
async-trait.workspace = true
tokio.workspace = true
nix.workspace = true
libc.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
