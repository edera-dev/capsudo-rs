[toolchain]
channel = "1.89.0"
components = ["rustfmt", "rust-std", "clippy"]
# Declared here (not only via `rustup target add` in the Makefile) because that
# command ignores this toolchain override and would add the target to the
# default toolchain instead of the pinned one.
targets = ["x86_64-unknown-linux-musl"]
