[workspace]
resolver = "2"
members = [
    "crates/capsudo-proto",
    "crates/capsudo-transport",
    "crates/capsudo-core",
    "crates/capsudo",
    "crates/capsudod",
    "crates/capsudod-pwauth",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "0BSD"
authors = ["Edera, Inc."]
repository = "https://github.com/ariadneconill/capsudo-rs"

[workspace.dependencies]
thiserror = "2"
async-trait = "0.1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "io-util", "macros", "sync", "time", "process", "signal"] }
nix = { version = "0.29", features = ["socket", "uio", "term", "process", "fs", "user"] }
libc = "0.2"
capsudo-proto = { path = "crates/capsudo-proto" }
capsudo-transport = { path = "crates/capsudo-transport" }
capsudo-core = { path = "crates/capsudo-core" }
